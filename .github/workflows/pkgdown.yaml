# Based on r-lib/actions v2 examples, reviewed 2026-09-13.
name: pkgdown
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        shell: Rscript {0}
        run: |
          pkgdown::clean_site()
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
      - uses: actions/upload-artifact@v7
        with:
          name: pkgdown-site
          path: docs
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Remove legacy generated site from deployment checkout
        run: rm -rf docs
      - uses: actions/download-artifact@v8
        with:
          name: pkgdown-site
          path: docs
      - uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: docs
          clean: true
