# Based on r-lib/actions v2 examples, reviewed 2026-09-13.
name: quality
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation-and-lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: roxygen2@8.1.0, any::lintr, local::.
      - name: Regenerate documentation
        shell: Rscript {0}
        run: roxygen2::roxygenise()
      - name: Verify generated documentation is committed
        run: git diff --exit-code -- DESCRIPTION man NAMESPACE
      - name: Lint
        shell: Rscript {0}
        run: |
          lints <- lintr::lint_package()
          print(lints)
          stopifnot(length(lints) == 0L)
  visual-snapshots:
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: 'true'
      COCORRESP_VISUAL_TESTS: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::pkgload, any::vdiffr
      - name: Compare visual snapshots
        shell: Rscript {0}
        run: testthat::test_local(filter = "visual", stop_on_failure = TRUE)
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-snapshot-diffs
          path: tests/testthat/_snaps/visual
  optional-backends:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::pkgload, any::future.apply, any::futurize, any::mirai, any::future.mirai
      - name: Check worker implementations
        shell: Rscript {0}
        run: testthat::test_local(filter = "parallel", stop_on_failure = TRUE)
  release-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
      - name: Full source and PDF manual check
        shell: Rscript {0}
        run: rcmdcheck::rcmdcheck(args = "--as-cran", error_on = "note")
